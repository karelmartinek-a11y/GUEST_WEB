server {
    listen 80;
    listen [::]:80;
    server_name guest.hcasc.cz;
    access_log off;
    error_log /var/log/nginx/guest-web-error.log warn;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/guest-web/acme; }
    location / { return 301 https://guest.hcasc.cz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name guest.hcasc.cz;
    ssl_certificate /etc/letsencrypt/live/guest.hcasc.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guest.hcasc.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/guest-web/current/www;
    index index.html;
    access_log off;
    error_log /var/log/nginx/guest-web-error.log warn;
    include /etc/guest-web/headers.conf;
    client_max_body_size 2k;
    autoindex off;
    etag on;
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; expires -1; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~ \.mjs$ { types { application/javascript mjs; } try_files $uri =404; expires 1y; }
    location ^~ /media/photos/ { try_files $uri =404; expires 1d; }
    location ^~ /maps/ { try_files $uri =404; expires 1d; }
    location = /release.json { expires -1; }
    location = /capabilities.json { expires -1; }
    # Enabled only after full physical acceptance. Proxy itself also rejects unapproved targets.
    location = /api/route { return 503; }
    location ~ /\. { deny all; }
}
